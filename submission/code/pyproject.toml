[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai05-fair-relief-routing"
version = "0.1.0"
description = "Fair essential-goods allocation and routing for AI-05"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = ["submission", "dist", "build", "node_modules"]
